name: Publish test viewer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
      - name: Download explicitly enabled test inputs
        if: ${{ vars.UZMAP_HOSTED_INPUTS == 'enabled' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p fixtures/maps fixtures/stock
          gh release download playtest-inputs-v1 --pattern GemTower_Max_7C.w3x --dir fixtures/maps
          gh release download playtest-inputs-v1 --pattern unit-abilities.json --dir fixtures/stock
      - name: Build browser runtime
        run: node scripts/build-web.mjs
      - name: Check source input and public package boundaries
        run: node --experimental-strip-types --test test/web/source-input.test.ts test/web/browser-compat.test.ts test/web/frame-start.test.ts test/web/first-entry.test.ts test/web/field-culling.test.ts test/scripts/pages-package.test.ts test/scripts/web-build-version.test.ts test/sim/issue-1-navigation.test.ts test/runtime/issue-1-amethyst.test.ts test/web/issue-1-seed.test.ts test/web/issue-1-field.test.ts test/runtime/build-preview.test.ts test/web/field-art.test.ts test/web/build-preview-ui.test.ts test/runtime/orchestration-combat-regressions.test.ts test/runtime/orchestration-attack-events.test.ts test/web/mobile-action-flow-repair.test.ts test/web/orchestration-chat-replay.test.ts test/web/orchestration-fatal-controls.test.ts test/web/restore-controls.test.ts test/web/automatic-checkpoint.test.ts test/web/automatic-checkpoint-ui.test.ts test/web/native-dialog-replay.test.ts test/runtime/source-passive-catalog.test.ts test/runtime/bash-combat.test.ts test/formats/source-passive-stock-intake.test.ts test/web/source-passive-ui-labels.test.ts test/web/source-passive-acquisition-visibility.test.ts test/runtime/source-dot-catalog.test.ts test/runtime/source-dot-combat.test.ts test/sim/source-dot-hash.test.ts test/web/source-dot-ui-labels.test.ts test/scripts/replay-build-version.test.ts test/jass/natives/gem-identity-g1.test.ts test/jass/natives/readiness-replace-state.test.ts test/jass/natives/text-display-context.test.ts test/web/casino-feedback.test.ts test/web/recipe-book.test.ts
      - name: Package public files
        env:
          UZMAP_HOSTED_INPUTS: ${{ vars.UZMAP_HOSTED_INPUTS }}
        run: |
          if [ "$UZMAP_HOSTED_INPUTS" = "enabled" ]; then
            node scripts/package-pages.mjs --with-source-inputs
          else
            node scripts/package-pages.mjs
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public viewer
        uses: actions/upload-pages-artifact@v4
        with:
          path: .site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
