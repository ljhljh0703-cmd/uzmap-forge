name: Verify feedback changes
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: feedback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
      - name: Download the two already published test inputs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p fixtures/maps fixtures/stock
          gh release download playtest-inputs-v1 --pattern GemTower_Max_7C.w3x --dir fixtures/maps
          gh release download playtest-inputs-v1 --pattern unit-abilities.json --dir fixtures/stock
      - name: Build browser runtime
        run: node scripts/build-web.mjs
      - name: Run committed regression tests
        run: npm test
      - name: Verify hosted package and pinned source hashes
        run: node scripts/package-pages.mjs --with-source-inputs
