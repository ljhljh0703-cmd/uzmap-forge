name: Publish test viewer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
      - name: Download explicitly enabled test inputs
        if: ${{ vars.UZMAP_HOSTED_INPUTS == 'enabled' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p fixtures/maps fixtures/stock
          gh release download playtest-inputs-v1 --pattern GemTower_Max_7C.w3x --dir fixtures/maps
          gh release download playtest-inputs-v1 --pattern unit-abilities.json --dir fixtures/stock
      - name: Build browser runtime
        run: node scripts/build-web.mjs
      - name: Check source input and public package boundaries
        run: node --experimental-strip-types --test test/jass/natives/trigonometry.test.ts test/jass/natives/presentation-noops.test.ts test/web/ui-mutation-budget.test.ts test/web/damage-paint-budget.test.ts test/web/ui-art-c.test.ts test/web/art-startup.test.ts test/web/source-input.test.ts test/web/browser-compat.test.ts test/web/frame-start.test.ts test/web/first-entry.test.ts test/web/field-culling.test.ts test/scripts/pages-package.test.ts test/scripts/web-build-version.test.ts test/sim/issue-1-navigation.test.ts test/runtime/issue-1-amethyst.test.ts test/web/issue-1-seed.test.ts test/runtime/build-preview.test.ts test/web/field-art.test.ts test/web/build-preview-ui.test.ts test/runtime/orchestration-combat-regressions.test.ts test/runtime/orchestration-attack-events.test.ts test/web/mobile-action-flow-repair.test.ts test/web/orchestration-fatal-controls.test.ts test/web/restore-controls.test.ts test/web/automatic-checkpoint.test.ts test/web/automatic-checkpoint-ui.test.ts test/web/native-dialog-replay.test.ts test/runtime/source-passive-catalog.test.ts test/runtime/bash-combat.test.ts test/formats/source-passive-stock-intake.test.ts test/web/source-passive-ui-labels.test.ts test/web/source-passive-acquisition-visibility.test.ts test/runtime/source-dot-catalog.test.ts test/runtime/source-dot-combat.test.ts test/sim/source-dot-hash.test.ts test/web/source-dot-ui-labels.test.ts test/scripts/replay-build-version.test.ts test/jass/natives/gem-identity-g1.test.ts test/jass/natives/readiness-replace-state.test.ts test/jass/natives/text-display-context.test.ts test/web/casino-feedback.test.ts test/web/recipe-book.test.ts test/web/overlap-selection.test.ts test/runtime/casino-payout-view.test.ts test/web/casino-choices.test.ts test/web/pointer-placement.test.ts test/web/mobile-touch-flow.test.ts test/web/save-upgrade.test.ts test/web/save-upgrade-ui.test.ts test/web/visual-field-polish.test.ts test/web/visual-units-polish.test.ts test/web/visual-interface-polish.test.ts test/web/mobile-action-clarity.test.ts test/web/gem-object-visuals.test.ts test/web/field-action-hint.test.ts test/web/combat-exit-cues.test.ts test/web/object-visual-integration.test.ts test/web/round-tray-visibility.test.ts test/web/ui-skin.test.ts test/web/menu-research-flow.test.ts test/web/mobile-selection-sheet.test.ts test/web/source-readability.test.ts test/web/action-feedback.test.ts test/web/first-minute.test.ts test/web/play-ui.test.ts test/web/result-restart.test.ts test/web/result-records.test.ts test/web/field-effects.test.ts test/web/field-art-integration.test.ts test/web/field-ground-b.test.ts test/web/field-units.test.ts test/web/visual-assets.test.ts test/web/field-road-width.test.ts test/web/precision-camera.test.ts test/web/precision-camera-ui.test.ts test/web/game-menu.test.ts test/web/window-materials.test.ts test/web/pc-readability.test.ts test/web/first-run-research.test.ts test/web/source-help.test.ts test/web/source-help-integration.test.ts test/web/combination-hints.test.ts test/web/recipe-priority.test.ts test/web/wave-notices.test.ts test/web/wave-preview-integration.test.ts test/web/first-encounter.test.ts test/web/first-encounter-integration.test.ts test/web/first-run-guide.test.ts test/web/first-run-guide-view.test.ts test/web/attack-range-view.test.ts test/web/attack-range-paint.test.ts test/web/danger-readability.test.ts test/web/hud-life-cue.test.ts test/web/button-reasons.test.ts test/web/button-reasons-integration.test.ts test/web/virtual-touch-capture.test.ts test/web/audio-settings.test.ts test/web/audio-recording.test.ts test/web/audio-assets.test.ts test/web/sound-integration.test.ts test/web/cue-audio-engine.test.ts test/web/sound-events.test.ts test/jass/sound-call-observer.test.ts test/sim/death-observer.test.ts test/web/loading-screen.test.ts test/web/loading-integration.test.ts test/web/loading-failure.test.ts test/web/rotation-guard.test.ts test/web/tablet-layout.test.ts test/web/device-layout.test.ts test/web/mobile-fields.test.ts test/web/small-cell-placement.test.ts test/web/visual-assets-lazy.test.ts test/web/lazy-art-view.test.ts test/web/ui-material-lazy.test.ts test/scripts/f-assets.test.ts test/scripts/f-raster.test.ts test/web/route-intro.test.ts test/web/route-navigation.test.ts test/web/mobile-path-regressions.test.ts test/web/creep-health-presentation.test.ts test/web/upgrade-card.test.ts test/web/control-layout-contract.test.ts test/web/mobile-control-layout.test.ts test/web/recheck-followup.test.ts
      - name: Check original-source and transport behavior with explicitly enabled originals
        if: ${{ vars.UZMAP_HOSTED_INPUTS == 'enabled' }}
        run: node --experimental-strip-types --test test/runtime/slate-spacing-source.test.ts test/web/source-transport.test.ts test/scripts/source-package-transport.test.ts test/web/issue-1-field.test.ts test/web/orchestration-chat-replay.test.ts test/web/training-prerequisite-source.test.ts test/web/source-flight-visual.test.ts
      - name: Package public files
        env:
          UZMAP_HOSTED_INPUTS: ${{ vars.UZMAP_HOSTED_INPUTS }}
        run: |
          if [ "$UZMAP_HOSTED_INPUTS" = "enabled" ]; then
            node scripts/package-pages.mjs --with-source-inputs
          else
            node scripts/package-pages.mjs
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public viewer
        uses: actions/upload-pages-artifact@v4
        with:
          path: .site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
